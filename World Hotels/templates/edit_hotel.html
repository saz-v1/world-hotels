{% extends 'base.html' %}{% block content %}<main class="admin-shell"><a class="subtle-link" href="{{ url_for('admin') }}">← Dashboard</a>
    <h1>Edit Hotel</h1>
    <form action="{{ url_for('edit_hotel', hotel_id=hotel.HotelID) }}" method="post">
        <label for="location">Location:</label>
        <input type="text" id="location" name="location" value="{{ hotel.Location }}">
        <label for="on_peak_price">On Peak Price:</label>
        <input type="text" id="on_peak_price" name="on_peak_price" value="{{ hotel.OnPeakPrice }}">
        <label for="off_peak_price">Off Peak Price:</label>
        <input type="text" id="off_peak_price" name="off_peak_price" value="{{ hotel.OffPeakPrice }}">
        <button type="submit">Update</button>
    </form>
</main>{% endblock %}
