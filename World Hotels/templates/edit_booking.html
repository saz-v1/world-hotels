{% extends 'base.html' %}{% block content %}<main class="admin-shell"><a class="subtle-link" href="{{ url_for('admin') }}">← Dashboard</a>
    <h1>Edit Booking</h1>
    <form action="{{ url_for('edit_booking', booking_id=booking_id) }}" method="post">
        <!-- Display the existing booking details in input fields -->
        <label for="checkin_date">Check-in Date:</label>
        <input type="date" id="checkin_date" name="checkin_date" value="{{ booking.CheckInDate }}">
        <label for="checkout_date">Check-out Date:</label>
        <input type="date" id="checkout_date" name="checkout_date" value="{{ booking.CheckOutDate }}">
        <button type="submit">Save Changes</button>
    </form>
</main>{% endblock %}
