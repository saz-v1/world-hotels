{% extends 'base.html' %}{% block content %}<main class="admin-shell"><a class="subtle-link" href="{{ url_for('admin') }}">← Dashboard</a>
    <h1>USERS</h1>
    <table>
        <tr>
            <th>Customer ID</th>
            <th>Email</th>
            <th>Change</th>
        </tr>
        {% for user in users %}
        <tr>
            <td class="user-id">{{ user.CustomerID }}</td>
            <td class="user-email">{{ user.Email }}</td>
            <td>
                <a href="{{ url_for('edit_user', user_id=user.CustomerID) }}"><button>Edit</button></a>
                <form action="{{ url_for('delete_user', user_id=user.CustomerID) }}" method="post" style="display:inline;">
                    <button type="submit" onclick="return confirm('Are you sure you want to delete this user?')">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</main>{% endblock %}
